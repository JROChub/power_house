name: origin-rustfmt-export

on:
  pull_request:
    branches: ["main", "master"]

permissions:
  contents: write
  pull-requests: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout pull request head
        uses: actions/checkout@v6
        with:
          ref: ${{ github.head_ref }}

      - name: Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Format Origin sources
        run: cargo fmt

      - name: Commit canonical rustfmt output
        run: |
          if git diff --quiet -- \
            src/origin.rs \
            src/lib.rs \
            examples/origin_live_proof.rs \
            tests/origin.rs; then
            echo "Origin sources already formatted"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            src/origin.rs \
            src/lib.rs \
            examples/origin_live_proof.rs \
            tests/origin.rs
          git commit -m "Format Origin sources"
          git push origin HEAD:${{ github.head_ref }}
