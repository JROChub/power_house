name: powerhouse-ci

on:
  push:
    branches: ["main", "master"]
  pull_request:
    branches: ["main", "master"]

jobs:
  # BEGIN ORIGIN RELEASE BOOTSTRAP
  prepare-origin-release:
    if: github.event_name == 'pull_request' && github.head_ref == 'agent/origin-verified-creation'
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Check out release branch
        uses: actions/checkout@v6
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy,rustfmt

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2

      - name: Reconstruct and apply audited release candidate
        shell: bash
        run: |
          set -euo pipefail
          : > scripts/origin-release-error.log
          exec > >(tee -a scripts/origin-release-error.log) 2>&1
          : > scripts/prepare_origin_release.py
          for part in scripts/.origin-release-part-*.b64; do
            base64 --decode "$part" >> scripts/prepare_origin_release.py
          done
          echo "c3fe43cf64f2139d4059ff4ed01fb0ba02386bdf401bc8bc9cfc3dff792a5ab0  scripts/prepare_origin_release.py" | sha256sum --check --strict
          python3 - <<'PY'
          from pathlib import Path

          script = Path("scripts/prepare_origin_release.py")
          lines = script.read_text(encoding="utf-8").splitlines(keepends=True)
          matches = [
              index
              for index, line in enumerate(lines)
              if line == '    ".github/workflows/ci.yml",\n'
          ]
          if matches != [339]:
              raise SystemExit(f"unexpected CI patch marker indexes: {matches}")
          index = matches[0]
          expected = [
              "insert_after(\n",
              '    ".github/workflows/ci.yml",\n',
              "    '''          node --check publicpower/app.js\\n''',\n",
              "    '''          node --check publicpower/tessaryn/origin.js\\n''',\n",
              ")\n",
          ]
          if lines[index - 1 : index + 4] != expected:
              raise SystemExit("temporary CI patch context changed")
          lines[index - 1] = "replace_count(\n"
          lines[index + 2] = "    '''          node --check publicpower/app.js\\n          node --check publicpower/tessaryn/origin.js\\n''',\n"
          lines.insert(index + 3, "    2,\n")
          script.write_text("".join(lines), encoding="utf-8")
          PY
          echo "f08ecc7cb60658804d133c03999727ff6955b96805d73db18f11c157df03bf8c  scripts/prepare_origin_release.py" | sha256sum --check --strict
          python3 -m py_compile scripts/prepare_origin_release.py
          python3 scripts/prepare_origin_release.py
          python3 - <<'PY'
          from pathlib import Path

          origin = Path("src/origin.rs")
          text = origin.read_text(encoding="utf-8")
          replacements = {
              "self.label.as_bytes().len()": "self.label.len()",
              "name.as_bytes().len()": "name.len()",
              "spec.source.as_bytes().len()": "spec.source.len()",
              "self.dense_boundary_units % DENSE_BOUNDARY_MULTIPLIER != 0": "!self.dense_boundary_units.is_multiple_of(DENSE_BOUNDARY_MULTIPLIER)",
          }
          for old, new in replacements.items():
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"unexpected Origin lint-fix count for {old!r}: {count}")
              text = text.replace(old, new, 1)
          origin.write_text(text, encoding="utf-8")
          PY

      - name: Validate metadata and browser surface
        shell: bash
        run: |
          set -euo pipefail
          exec > >(tee -a scripts/origin-release-error.log) 2>&1
          cargo fmt --all
          git diff --check
          python3 scripts/check_release_consistency.py
          node --check publicpower/app.js
          node --check publicpower/tessaryn/origin.js

      - name: Verify Rust release surface
        shell: bash
        env:
          RUSTDOCFLAGS: -D warnings
        run: |
          set -euo pipefail
          exec > >(tee -a scripts/origin-release-error.log) 2>&1
          cargo clippy --locked --all-targets --all-features -- -D warnings
          cargo doc --locked --all-features --no-deps
          cargo test --locked --all-features
          cargo test --locked --features sfcs --test origin
          cargo run --locked --features sfcs --example origin_live_proof
          cargo package --locked --allow-dirty

      - name: Confirm publication credential readiness
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          exec > >(tee -a scripts/origin-release-error.log) 2>&1
          if [[ -n "${CARGO_REGISTRY_TOKEN:-}" ]]; then
            echo "crates.io repository credential: configured"
          else
            echo "crates.io repository credential: not visible to this pull-request job" >&2
          fi

      - name: Commit verified release preparation
        shell: bash
        run: |
          set -euo pipefail
          exec > >(tee -a scripts/origin-release-error.log) 2>&1
          python3 - <<'PY'
          from pathlib import Path

          ci = Path(".github/workflows/ci.yml")
          text = ci.read_text(encoding="utf-8")
          start_marker = "  # BEGIN ORIGIN RELEASE BOOTSTRAP\n"
          end_marker = "  # END ORIGIN RELEASE BOOTSTRAP\n"
          start = text.index(start_marker)
          end = text.index(end_marker, start) + len(end_marker)
          ci.write_text(text[:start] + text[end:], encoding="utf-8")

          release = Path(".github/workflows/release-gate.yml")
          release_text = release.read_text(encoding="utf-8")
          release.write_text(
              release_text.replace("docker/login-action@v3", "docker/login-action@v4"),
              encoding="utf-8",
          )
          PY
          rm -rf .github/origin-prep
          rm -f .github/workflows/origin-release-prep.yml
          rm -f scripts/prepare_origin_release.py
          rm -f scripts/.origin-release-part-*.b64
          rm -f scripts/origin-release-error.log
          rm -f .github/workflows/origin-release-prepare.yml
          cargo fmt --all --check
          git diff --check
          python3 scripts/check_release_consistency.py
          node --check publicpower/tessaryn/origin.js
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Prepare Power House v0.3.25 Origin release"
          git push origin HEAD:${{ github.head_ref }}

      - name: Persist preparation failure without partial source edits
        if: failure()
        shell: bash
        run: |
          set -euo pipefail
          test -s scripts/origin-release-error.log || echo "preparation failed before diagnostic capture" > scripts/origin-release-error.log
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f scripts/origin-release-error.log
          git commit -m "Record Origin release preparation failure" || exit 0
          git push origin HEAD:${{ github.head_ref }}
  # END ORIGIN RELEASE BOOTSTRAP

  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy,rustfmt

      - name: Terraform toolchain
        uses: hashicorp/setup-terraform@v4

      - name: Cache
        uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --check

      - name: Release version and naming consistency
        run: python3 scripts/check_release_consistency.py

      - name: Operational configuration
        run: |
          bash -n \
            scripts/deploy_rpc_cluster.sh \
            scripts/deploy_monitoring_stack.sh \
            scripts/install_reliability_campaign.sh \
            scripts/provision_digitalocean_rpc.sh \
            infra/ops/alert.sh
          python3 -m py_compile \
            scripts/check_release_consistency.py \
            scripts/check_rustdoc_links.py \
            scripts/rpc_load_test.py \
            scripts/test_reliability_campaign.py \
            scripts/test_observatory_contract.py \
            scripts/test_observer_intake.py \
            scripts/test_observer_registry.py \
            scripts/test_status_registry.py \
            scripts/test_validator_registry.py \
            infra/ops/healthcheck.py \
            infra/monitoring/alert_receiver.py \
            infra/monitoring/observer_intake.py \
            infra/monitoring/observer_registry.py \
            infra/monitoring/reliability_campaign.py \
            infra/monitoring/status_api.py \
            infra/monitoring/validator_registry.py
          jq empty configs/network.json contrib/grafana/mfenx_powerhouse_dashboard.json
          terraform -chdir=infra/terraform/digitalocean fmt -check
          terraform -chdir=infra/terraform/digitalocean init -backend=false
          terraform -chdir=infra/terraform/digitalocean validate

      - name: Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Documentation
        env:
          RUSTDOCFLAGS: -D warnings
        run: |
          cargo doc --all-features --no-deps
          python3 scripts/check_rustdoc_links.py

      - name: Test default targets
        run: cargo test --all-targets --locked

      - name: Origin verified-creation proof
        run: |
          cargo test --locked --features sfcs --test origin
          cargo run --locked --features sfcs --example origin_live_proof

      - name: Test network targets
        run: cargo test --all-targets --features net --locked

      - name: CLI contract tests
        run: bash scripts/test_cli.sh

      - name: RPC cluster bundle tests
        run: python3 scripts/test_generate_rpc_cluster.py

      - name: Signed validator registry
        run: |
          python3 scripts/test_validator_registry.py
          python3 scripts/test_observer_registry.py
          python3 scripts/test_status_registry.py
          python3 scripts/test_observer_intake.py
          python3 scripts/test_reliability_campaign.py

      - name: DigitalOcean provisioning contract
        run: scripts/test_digitalocean_provision.sh

      - name: RPC publication-gate tests
        run: python3 scripts/test_rpc_check.py

      - name: Native RPC replica finality
        run: scripts/test_native_rpc_cluster.sh

      - name: Reproduce sparse conformance vectors
        run: |
          cargo run --example conformance_vectors
          git diff --exit-code -- conformance/v1

      - name: Reproduce PHA and Rootprint conformance vectors
        run: |
          cargo run --example pha_conformance_vectors
          git diff --exit-code -- \
            conformance/pha-v1 \
            publicpower/artifacts/rootprint-valid.json

      - name: Reproduce identity conformance vectors
        run: |
          cargo run --example identity_conformance_vectors
          git diff --exit-code -- conformance/identity-v1

      - name: Reproduce slbit Observatory conformance vectors
        run: |
          cargo run --example slbit_conformance_vectors
          git diff --exit-code -- \
            conformance/slbit-v1 \
            publicpower/artifacts/luminous-valid.json

      - name: Cross-language PHA and Rootprint verification
        run: PYTHONPATH=sdk/python python3 -m unittest discover -s sdk/python/tests -v

      - name: Large-domain examples
        run: |
          cargo run --release --example sextillion_verify
          cargo run --release --example hyperscale_affine
          cargo run --release --example sparse_record
          cargo run --release --example committed_workload

      - name: Cross-language sparse verification
        run: |
          python3 scripts/verify_sparse_certificate.py target/power_house_sparse_record.phsp
          python3 scripts/verify_sparse_certificate.py \
            target/external_interaction_model.phcp \
            --polynomial target/external_interaction_model.phsm

      - name: Sparse verifier conformance and mutation tests
        run: python3 scripts/test_sparse_verifier.py

      - name: Browser artifact stream regression
        run: |
          node --check publicpower/app.js
          node --check publicpower/campaign.js
          node scripts/test_observatory_stream.mjs
          python3 scripts/test_observatory_contract.py

      - name: Soundness budget checks
        run: |
          python3 scripts/soundness_budget.py
          python3 scripts/soundness_budget.py \
            --field 18446744073709551557 \
            --repetitions 3
