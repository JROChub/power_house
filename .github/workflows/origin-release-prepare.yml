name: prepare-origin-release

on:
  push:
    branches: ["agent/origin-verified-creation"]
    paths:
      - ".github/workflows/origin-release-prepare.yml"

permissions:
  contents: write

concurrency:
  group: prepare-origin-release
  cancel-in-progress: false

jobs:
  prepare:
    if: github.event.head_commit.message == 'Run Origin v0.3.25 release preparation'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Check out release branch
        uses: actions/checkout@v6
        with:
          ref: agent/origin-verified-creation
          fetch-depth: 0

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Reconstruct and authenticate release preparation
        shell: bash
        run: |
          set -euo pipefail
          : > scripts/prepare_origin_release.py
          for part in scripts/.origin-release-part-*.b64; do
            base64 --decode "$part" >> scripts/prepare_origin_release.py
          done
          echo "16fdf607a7b4bd25d2db5f0804bf256228d33a557e824fa250b466bb77f4e7bd  scripts/prepare_origin_release.py" | sha256sum --check --strict
          python3 -m py_compile scripts/prepare_origin_release.py
          python3 scripts/prepare_origin_release.py

      - name: Format and static consistency
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --all
          git diff --check
          python3 scripts/check_release_consistency.py
          node --check publicpower/app.js
          node --check publicpower/tessaryn/origin.js

      - name: Clippy all targets and features
        run: cargo clippy --locked --all-targets --all-features -- -D warnings

      - name: Rustdoc all features
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --locked --all-features --no-deps

      - name: Full all-feature test suite
        run: cargo test --locked --all-features

      - name: Origin integration proof
        shell: bash
        run: |
          set -euo pipefail
          cargo test --locked --features sfcs --test origin
          cargo run --locked --features sfcs --example origin_live_proof

      - name: Package release crate
        run: cargo package --locked

      - name: Confirm publication credential readiness
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        shell: bash
        run: |
          if [[ -n "${CARGO_REGISTRY_TOKEN:-}" ]]; then
            echo "crates.io credential: configured"
          else
            echo "crates.io credential: missing" >&2
          fi

      - name: Commit verified release preparation
        shell: bash
        run: |
          set -euo pipefail
          rm -f scripts/prepare_origin_release.py scripts/.origin-release-part-*.b64
          rm -f .github/workflows/origin-release-prepare.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Prepare Power House v0.3.25 Origin release"
          git push origin HEAD:agent/origin-verified-creation
