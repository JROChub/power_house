name: origin-clippy-fix

on:
  pull_request:
    branches: ["main", "master"]

permissions:
  contents: write
  pull-requests: read

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout pull request head
        uses: actions/checkout@v6
        with:
          ref: ${{ github.head_ref }}

      - name: Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Group receipt transition material
        run: |
          echo '' | base64 --decode | python3
          cargo fmt
          git diff --check

      - name: Commit Clippy fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/origin.rs
          git commit -m "Group Origin receipt transition material"
          git push origin HEAD:${{ github.head_ref }}
