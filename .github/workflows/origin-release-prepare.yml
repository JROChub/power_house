name: Origin v0.3.25 release preparation

on:
  push:
    branches: ["agent/origin-verified-creation"]
    paths:
      - ".github/workflows/origin-release-prepare.yml"

permissions:
  contents: write

concurrency:
  group: prepare-origin-release
  cancel-in-progress: false

jobs:
  prepare:
    if: github.event.head_commit.message == 'Run Origin v0.3.25 release preparation'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Check out release branch
        uses: actions/checkout@v6
        with:
          ref: agent/origin-verified-creation
          fetch-depth: 0

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy,rustfmt

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2

      - name: Reconstruct and apply audited release candidate
        shell: bash
        run: |
          set -euo pipefail
          exec > >(tee scripts/origin-release-error.log) 2>&1
          : > scripts/prepare_origin_release.py
          for part in scripts/.origin-release-part-*.b64; do
            base64 --decode "$part" >> scripts/prepare_origin_release.py
          done
          echo "c3fe43cf64f2139d4059ff4ed01fb0ba02386bdf401bc8bc9cfc3dff792a5ab0  scripts/prepare_origin_release.py" | sha256sum --check --strict
          python3 - <<'PY'
          from pathlib import Path

          script = Path("scripts/prepare_origin_release.py")
          text = script.read_text(encoding="utf-8")
          old = '''insert_after(
              ".github/workflows/ci.yml",
              \'\'\'          node --check publicpower/app.js\n\'\'\',
              \'\'\'          node --check publicpower/tessaryn/origin.js\n\'\'\',
          )'''
          new = '''replace_count(
              ".github/workflows/ci.yml",
              \'\'\'          node --check publicpower/app.js\n\'\'\',
              \'\'\'          node --check publicpower/app.js\n          node --check publicpower/tessaryn/origin.js\n\'\'\',
              2,
          )'''
          if text.count(old) != 1:
              raise SystemExit("could not patch temporary duplicate CI marker")
          script.write_text(text.replace(old, new, 1), encoding="utf-8")
          PY
          echo "f08ecc7cb60658804d133c03999727ff6955b96805d73db18f11c157df03bf8c  scripts/prepare_origin_release.py" | sha256sum --check --strict
          python3 -m py_compile scripts/prepare_origin_release.py
          python3 scripts/prepare_origin_release.py

      - name: Validate metadata and browser surface
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --all
          git diff --check
          python3 scripts/check_release_consistency.py
          node --check publicpower/app.js
          node --check publicpower/tessaryn/origin.js

      - name: Verify Rust release surface
        shell: bash
        env:
          RUSTDOCFLAGS: -D warnings
        run: |
          set -euo pipefail
          cargo clippy --locked --all-targets --all-features -- -D warnings
          cargo doc --locked --all-features --no-deps
          cargo test --locked --all-features
          cargo test --locked --features sfcs --test origin
          cargo run --locked --features sfcs --example origin_live_proof
          cargo package --locked

      - name: Confirm publication credential readiness
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        shell: bash
        run: |
          if [[ -n "${CARGO_REGISTRY_TOKEN:-}" ]]; then
            echo "crates.io repository credential: configured"
          else
            echo "crates.io repository credential: not visible to this preparation job" >&2
          fi

      - name: Commit the verified release candidate and remove transport files
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          ci = Path(".github/workflows/ci.yml")
          text = ci.read_text(encoding="utf-8")
          start_marker = "  # BEGIN ORIGIN RELEASE BOOTSTRAP\n"
          end_marker = "  # END ORIGIN RELEASE BOOTSTRAP\n"
          start = text.index(start_marker)
          end = text.index(end_marker, start) + len(end_marker)
          ci.write_text(text[:start] + text[end:], encoding="utf-8")

          release = Path(".github/workflows/release-gate.yml")
          release_text = release.read_text(encoding="utf-8")
          release.write_text(
              release_text.replace("docker/login-action@v3", "docker/login-action@v4"),
              encoding="utf-8",
          )
          PY
          rm -f scripts/prepare_origin_release.py
          rm -f scripts/.origin-release-part-*.b64
          rm -f scripts/origin-release-error.log
          rm -f .github/workflows/origin-release-prepare.yml
          cargo fmt --all --check
          git diff --check
          python3 scripts/check_release_consistency.py
          node --check publicpower/tessaryn/origin.js
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Prepare Power House v0.3.25 Origin release"
          git push origin HEAD:agent/origin-verified-creation

      - name: Persist preparation failure without partial source edits
        if: failure()
        shell: bash
        run: |
          set -euo pipefail
          test -s scripts/origin-release-error.log || echo "preparation failed before diagnostic capture" > scripts/origin-release-error.log
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f scripts/origin-release-error.log
          git commit -m "Record Origin release preparation failure" || exit 0
          git push origin HEAD:agent/origin-verified-creation
